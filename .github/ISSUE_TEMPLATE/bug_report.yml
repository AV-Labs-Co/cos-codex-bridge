name: Bug report
description: Report a reproducible bridge failure with private data removed.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private prompts, receipt contents and personal filesystem paths before submitting.
  - type: input
    id: version
    attributes:
      label: Bridge and Codex versions
      placeholder: CoS Codex Bridge 0.1.0; Codex CLI x.y.z
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Grok Bot / Chief of Staff
        - Codex Desktop
        - Another stdio MCP client
        - Demo mode
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the error code and a redacted reproduction. Do not paste private receipt files.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private prompts and personal filesystem paths.
          required: true

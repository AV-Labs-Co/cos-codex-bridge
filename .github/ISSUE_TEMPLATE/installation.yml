name: Installation result
description: Tell us whether setup worked in your local MCP client, or where it stopped.
title: "[Install]: "
body:
  - type: markdown
    attributes:
      value: |
        Successful installs and failed attempts both help. Please share only redacted setup details, not credentials, private prompts, full receipts or personal paths.
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: macOS 15; Node 22
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Bridge version and installation method
      placeholder: 0.1.4 from npm
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Local MCP client and version
      description: Enter terminal demo only if you have not connected a client.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Furthest successful step
      options:
        - Package installation
        - Demo completed
        - Doctor completed
        - Client discovered bridge tools
        - Real prompt completed
        - Follow-up completed in the same task
        - None yet
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What worked or where setup stopped
      description: Include the first error code and a redacted command if something failed. For success, tell us which workflow you tried.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private prompts, full receipts and personal paths.
          required: true
